<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Search and Filtering</title>
  <link rel="stylesheet" href="filter.css">
  <script src="filter.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="task-panel" aria-labelledby="page-title">
      <header class="page-header">
        <p class="eyebrow">Workspace</p>
        <h1 id="page-title">Task search</h1>
        <p class="intro">Find the work that needs your attention.</p>
      </header>

      <div class="controls" aria-label="Task controls">
        <label class="search-field" for="task-search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <span class="sr-only">Search tasks</span>
          <input id="task-search" type="search" placeholder="Search tasks..." autocomplete="off">
          <button class="clear-button" id="clear-search" type="button" aria-label="Clear search" hidden>
            <span aria-hidden="true">&times;</span>
          </button>
        </label>

        <div class="filter-group" role="group" aria-label="Filter tasks by status">
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">Pending</button>
        </div>
      </div>

      <div class="list-heading">
        <h2>My tasks</h2>
        <p id="task-count" aria-live="polite"></p>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state" hidden>No tasks match your search.</p>
    </section>
  </main>
</body>
</html>
