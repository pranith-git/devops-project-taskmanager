<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager Login</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --primary: #60a5fa;
        --primary-dark: #3b82f6;
        --danger: #ef4444;
        --success: #22c55e;
        --border: rgba(148, 163, 184, 0.2);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #020817, #111827 35%, #0f172a);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .login-card {
        width: min(92vw, 420px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 2rem;
      }

      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      label {
        display: flex;
        flex-direction: column;
        font-size: 0.9rem;
        color: var(--muted);
        gap: 8px;
      }

      input {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        font-size: 1rem;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }

      .primary {
        background: var(--primary);
        color: #081122;
      }

      .secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }

      .message {
        min-height: 22px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .error { color: var(--danger); }
      .success { color: var(--success); }
    </style>
  </head>
  <body>
    <main class="login-card">
      <h1>Task Manager</h1>
      <p class="subtitle">Sign in to continue</p>

      <form id="login-form">
        <label>
          Username
          <input id="username" name="username" type="text" autocomplete="username" required />
        </label>

        <label>
          Password
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>

        <button class="primary" type="submit">Login</button>
        <button class="secondary" type="button" id="register-btn">Create account</button>
      </form>

      <p id="message" class="message" aria-live="polite"></p>
    </main>

    <script src="login.js"></script>
  </body>
</html>
